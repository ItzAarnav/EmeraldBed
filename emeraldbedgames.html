<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EmeraldBed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#111;
  --panel:#1e1e1e;
  --card:#2b2b2b;
  --text:#fff;
  --accent:#00ff99;
}
.light{
  --bg:#f4f4f4;
  --panel:#ffffff;
  --card:#e0e0e0;
  --text:#111;
  --accent:#00aa66;
}

*{box-sizing:border-box}

html,body{
  height:100%;
  margin:0;
  font-family:'Roboto',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

header{
  height:60px;
  background:var(--panel);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

header button{
  background:var(--card);
  color:var(--text);
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}
header button:hover{transform:scale(1.1)}

#app{
  position:relative;
  height:calc(100vh - 60px);
}

/* ---------- SCREEN SYSTEM (FIXED) ---------- */
.screen{
  position:absolute;
  inset:0;
  display:none;
  pointer-events:none;
  background:var(--bg); /* ✅ FIX */
}

.screen.active{
  display:flex;
  pointer-events:auto;
  z-index:5;
}

/* ---------- HOMESCREEN ---------- */
#homescreen{
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding-top:60px;
}

#logo{
  width:220px;
  margin-bottom:20px;
}

#homescreen h2{
  font-family:'Orbitron',sans-serif;
  color:var(--accent);
}

.main-btn{
  margin-top:15px;
  padding:15px 30px;
  font-size:1.2em;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:var(--accent);
  color:#111;
  font-family:'Orbitron',sans-serif;
  transition:0.25s;
}
.main-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 15px var(--accent);
}

/* ---------- MENU ---------- */
#menu{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
  padding:20px;
  overflow-y:auto;
  align-content:start;
  background:linear-gradient(var(--bg),var(--panel));
}

#menu button{
  background:var(--card);
  color:var(--text);
  border:none;
  border-radius:10px;
  padding:20px;
  font-family:'Orbitron',sans-serif;
  font-size:1.1em;
  cursor:pointer;
  min-height:80px;
  transition:0.25s;
}
#menu button:hover{
  transform:scale(1.07);
  background:#444;
}

/* ---------- GAME PAGE ---------- */
#gamePage{
  flex-direction:column;
  background:#000; /* ✅ SOLID */
  min-height:0;
}

#gameTop{
  height:50px;
  background:linear-gradient(#000,#111);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

#gameTop button{
  background:#000000cc;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}
#gameTop button:hover{transform:scale(1.1)}

#gameFrame{
  flex:1;
  width:100%;
  border:none;
  background:black;
}

#gameInfo{
  background:var(--panel);
  padding:12px;
  border-top:2px solid var(--accent);
}
#gameInfo h2{
  margin:0 0 5px;
  font-family:'Orbitron',sans-serif;
  color:var(--accent);
}
</style>
</head>

<body>

<header>
  <span>EmeraldBed</span>
  <button onclick="toggleTheme()">🌗</button>
</header>

<div id="app">

<div id="homescreen" class="screen active">
  <img src="https://iili.io/fckrcj2.png" id="logo">
  <h2>Welcome to EmeraldBed</h2>
  <p>Play unblocked games instantly, with crystal clear precision</p>
  <button class="main-btn" onclick="showMenu()">Begin Experience</button>
  <button id="resumeBtn" class="main-btn" style="display:none" onclick="resumeLastGame()">▶ Resume Last Game</button>
</div>

<div id="menu" class="screen">
  <button onclick="openGame('copter')">Copter.io</button>
  <button onclick="openGame('survival')">Survival Race Arena</button>
  <button onclick="openGame('diep')">Diep.io</button>
  <button onclick="openGame('florr')">Florr.io</button>
  <button onclick="openGame('slither')">Slither.io</button>
  <button onclick="openGame('zombs')">Zombs Royale</button>
  <button onclick="openGame('krunker')">Krunker.io</button>
  <button onclick="openGame('kour')">Kour.io</button>
  <button onclick="openGame('eaglercraft')">Eaglercraft</button>
  <button onclick="openGame('geometry')">Geometry Dash Lite</button>
  <button onclick="openGame('moomoo')">MooMoo.io</button>
  <button onclick="openGame('ragdoll')">Ragdoll Archers</button>
  <button onclick="openGame('drivemad')">Drive Mad</button>
  <button onclick="openGame('monkeymart')">Monkey Mart</button>
  <button onclick="openGame('retrobowl')">Retro Bowl</button>
  <button onclick="openGame('blockblast')">Block Blast</button>
  <button onclick="openGame('roblox')">Roblox</button>
  <button onclick="openGame('soundboard')">Meme Soundboard</button>
  <button onclick="openGame('google')">Google</button>
  <button onclick="openGame('yohoho')">YoHoHo.io</button>
  <button onclick="openGame('escape')">Escape Road 2</button>
  <button onclick="openGame('lolbeans')">LOLBeans.io</button>
  <button onclick="openGame('hole')">Hole.io</button>
  <button onclick="openGame('hexanaut')">Hexanaut.io</button>
  <button onclick="openGame('poki')">Poki</button>
  <button onclick="openGame('paper')">Paper.io</button>
  <button onclick="openGame('smashkarts')">Smash Karts</button>
  <button onclick="openGame('slope')">Slope</button>
  <button onclick="openGame('digdig')">digdig.io</button>
  <button onclick="openGame('ovo')">OvO</button>
  <button onclick="openGame('snowrider')">Snow Rider 3D</button>
  <button onclick="openGame('deadshot')">Deadshot</button>
  <button onclick="openGame('bloxd')">Bloxd.io</button>
  <button onclick="openGame('shellshock')">Shell Shockers</button>
  <button onclick="openGame('kiomet')">Kiomet</button>
  <button onclick="openGame('arras')">Arras.io</button>
  <button onclick="openGame('bonk')">Bonk.io</button>
  <button onclick="openGame('subwaysurfers')">Subway Surfers</button>
</div>

<div id="gamePage" class="screen">
  <div id="gameTop">
    <button onclick="backToMenu()">⬅ Back</button>
    <button onclick="openFullscreen()">⛶ Fullscreen</button>
  </div>
  <iframe id="gameFrame" allowfullscreen></iframe>
  <div id="gameInfo">
    <h2 id="gameTitle"></h2>
    <p id="gameDescription"></p>
  </div>
</div>

</div>

<script>
const games={
  copter:{title:"Copter.io",url:"https://copter.io",description:"Fight other players using a helicopter. Upgrade your copter, and dominate the battlefield!"},
  survival:{title:"Survival Race Arena",url:"https://survival-race.io",description:"A combo of spleef, with cars that can fly. Fun, but hard to explain lol"},
  diep:{title:"Diep.io",url:"https://diep.io",description:"Upgrade your tank to reach new heights, and totally obliterate your opponents."},
  florr:{title:"Florr.io",url:"https://florr.io",description:"Evolve your flower, collect new petals to win in combat."},
  slither:{title:"Slither.io",url:"https://slither.io",description:"Grow your snake, and feed on others... really explains the food chain."},
  zombs:{title:"Zombs Royale",url:"https://zombsroyale.io",description:"Basically 2D Fortnite. That's it."},
  krunker:{title:"Krunker.io",url:"https://krunker.io",description:"A fun FPS shooter."},
  kour:{title:"Kour.io",url:"https://kour.io",description:"Like Krunker.io but a fast-paced version."},
  eaglercraft:{title:"Eaglercraft",url:"https://eaglercraft.com",description:"Play Minecraft on your browser for free, but only supports older versions."},
  geometry:{title:"Geometry Dash Lite",url:"https://geometrydash-lite.io",description:"A fast-paced and quick reaction based platformer that never stops."},
  moomoo:{title:"MooMoo.io",url:"https://moomoo.io",description:"Build structures, gather resources, and survive the longest."},
  ragdoll:{title:"Ragdoll Archers",url:"https://ragdollarchers2.io",description:"Physics archery... with stickmans."},
  drivemad:{title:"Drive Mad",url:"https://drivemad.com",description:"Play over 100 fun, quick, and challenging levels that require precision driving of your truck, plane, or whatever."},
  monkeymart:{title:"Monkey Mart",url:"https://monkeymartonline.org",description:"Monkeys... run... marts?!"},
  retrobowl:{title:"Retro Bowl",url:"https://retrobowl.org",description:"The peak of American Football video games, in retro pixel style."},
  blockblast:{title:"Block Blast",url:"https://block-blast.io",description:"The fun, and addicting game found as a mobile app, but online."},
  roblox:{title:"Roblox",url:"https://now.gg/apps/roblox-corporation/5349/roblox.html",description:"Play Roblox. (NOTE: This app is currently down, or will only work for a short duration)"},
  soundboard:{title:"Meme Soundboard",url:"https://soundboardguys.com",description:"Meme sounds, and TikTok sounds so you can troll your teachers in class. Be stealthy though, you don't want to get caught playing the Fart Sound effect..."},
  google:{title:"Google",url:"https://google.com/?igu=1",description:"Google browser, but this isn't fully functional."},
  yohoho:{title:"YoHoHo.io",url:"https://yohoho.io",description:"Pirate battle royale, with fun and challenging mechanics. Collect over 30+ skins."},
  escape:{title:"Escape Road 2",url:"https://escaperoad2.io",description:"Online ripoff of the fun mobile game Smashy Road. Outrun the police, and collect a variety of vehicles, with fun mechanics."},
  lolbeans:{title:"LOLBeans.io",url:"https://lolbeans.io",description:"Online version of Fall Guys."},
  hole:{title:"Hole.io",url:"https://holeonline.io",description:"Consume the city, and become a bigger black hole."},
  hexanaut:{title:"Hexanaut.io",url:"https://hexanaut.io",description:"Control territory, much like paper io, but with new mechanics."},
  poki:{title:"Poki",url:"https://poki.com/?igu=1",description:"Find a lot of fun games here. (Experimental)"},
  paper:{title:"Paper.io",url:"https://paperiogame.io",description:"Considered as a classic io game. Like Paper.io? Check out Hexanaut.io, a more fun, and more featured version of paper io."},
  smashkarts:{title:"Smash Karts",url:"https://smashkarts.io",description:"Much like Mario Kart, minus the racing part, and more on the... fighting part. Pretty fun though, with cool weapons and stuff."},
  slope:{title:"Slope",url:"https://slopeio.org",description:"A rather challenging game, Slope focuses on accuracy and timed-precision, and it's rather fun as well!"},
  digdig:{title:"digdig.io",url:"https://digdig.io",description:"From the same creator of Florr.io, in DigDig.io you dig around a vast map, and try to conquer other diggers. It's worth a try at least once, but not the most reccomended for serious gamers."},
  ovo:{title:"OvO",url:"https://ovoclassic-pro.github.io/",description:"Slide, jump, and weave through over 20 fun, challenging, and realativley quick levels. OvO introduces new, fun mechanics in the world of parkour."},
  snowrider:{title:"Snow Rider 3D",url:"https://snowrider3dd.github.io/",description:"Evade incoming obstacles, and collect new sleds. In this sledding game, try to dodge the objects, and get better sleds with cool designs!"},
  deadshot:{title:"Deadshot",url:"https://deadshot.io/",description:"Much like Krunker.io, but with more challenging and realistic graphics and gameplay."},
  bloxd:{title:"Bloxd.io",url:"https://bloxd.io/",description:"It's like Minecraft and Roblox put together. Play hundreds of community created servers/games, and much, much, more!"},
  shellshock:{title:"Shell Shockers",url:"https://shellshock.io/",description:"A FPS shooting game, but with eggs. That's all that can be said..."},
  kiomet:{title:"Kiomet.io",url:"https://kiomet.com/",description:"Kiomet is a strategic game focused on capturing other territories, and deploy troops. It's not too much on the action side, but once you get the hang of it, it'll be fun real fast!"},
  arras:{title:"Arras.io",url:"https://arras.io/",description:"It's basically like Diep.io, but with more mechanics and easier features."},
  bonk:{title:"Bonk.io",url:"https://bonk.io/",description:"Bonk.io is a competitive multiplayer platformer game involving fun physics and controls."},
  subwaysurfers:{title:"Subway Surfers",url:"https://subway-surfers.gg/",description:"I'm sure EVERYONE knows this game... No explanation needed."}
};



const screens=document.querySelectorAll('.screen');
function showScreen(id){
  screens.forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showMenu(){showScreen('menu');}

function openGame(key){
  const g=games[key];
  localStorage.setItem('lastGame',key);
  showScreen('gamePage');
  gameFrame.src=g.url;
  gameTitle.textContent=g.title;
  gameDescription.textContent=g.description;
}

function resumeLastGame(){
  const key=localStorage.getItem('lastGame');
  if(key && games[key]) openGame(key);
}

function backToMenu(){
  gameFrame.src='';
  showScreen('menu');
}

function toggleTheme(){
  document.body.classList.toggle('light');
  localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');
}

function openFullscreen(){
  if(gameFrame.requestFullscreen) gameFrame.requestFullscreen();
}

window.onload=()=>{
  if(localStorage.getItem('theme')==='light') document.body.classList.add('light');
  if(localStorage.getItem('lastGame')) resumeBtn.style.display='inline-block';
};
</script>

</body>
</html>
